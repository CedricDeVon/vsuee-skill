name: Feature

on:
  push:
    branches: [feat/**]

jobs:
  test-installation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18', '20', '22']
        package-manager: [npm]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Stage Release Build
        run: npm run workflow:stage-release

      - name: Local Package Installation
        run: npm run deploy:local:release

      - name: Global Package Installation
        run: npm run deploy:global:release

      - name: Install Via ${{ matrix.package-manager }}
        shell: bash
        run: |
          npm init -y
          npm install .output/build/release/package
          npm install -g .output/build/release/package

      - name: Verify Local CLI Binary
        shell: bash
        run: npx vsuee --help

      - name: Verify Global CLI Binary
        shell: bash
        run: vsuee --help
