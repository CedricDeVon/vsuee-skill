name: Feature

on:
  push:
    branches: [feat/**]

jobs:
  test-local-installation:
    name: Test Installation | ${{ matrix.node-version }} | ${{ matrix.os }} | ${{ matrix.package-manager }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18', '20', '22']
        package-manager: [npm]
        output-build-release-package-path: [.output/build/release/package]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build Package
        run: |
          npm run output:cleanup
          npm run output:setup
          npm run build:release:package
          npm run test:pre-npm-deployment

      - name: Deploy Local Package
        run: |
          npm run clean:local:release
          npm run deploy:local:release

      - name: Deploy Global Package
        run: |
          npm run clean:global:release
          npm run deploy:global:release

      - name: Install Local Package Via ${{ matrix.package-manager }}
        shell: bash
        run: |
          npm init -y
          npm install ${{ matrix.output-build-release-package-path }}

      - name: Install Global Package Via ${{ matrix.package-manager }}
        shell: bash
        run: |
          npm init -y
          npm install -g ${{ matrix.output-build-release-package-path }}

      - name: Verify Local Package Installation
        shell: bash
        run: npx vsuee --help

      - name: Verify Global Package Installation
        shell: bash
        run: vsuee --help
