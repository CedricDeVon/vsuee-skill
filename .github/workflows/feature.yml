name: Feature

on:
  push:
    branches: [feat/**]

env:
  OUTPUT_BUILD_RELEASE_PACKAGE_PATH: .tmp/build/release/package

jobs:
  stage-release: # Single-executing job
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Build Release Package
        shell: bash
        run: |
          npm run tmp:cleanup
          npm run tmp:setup
          npm run build:release:package

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: staged-release
          path: ${{ env.OUTPUT_BUILD_RELEASE_PACKAGE_PATH }}

  test-local-installation:
    needs: stage-release
    name: Test Local Install | Node ${{ matrix.node-version }} | ${{ matrix.os }} | ${{ matrix.package-manager }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18', '20', '22', '24', '26']
        package-manager: [npm, pnpm, yarn, bun]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: staged-release
          path: staged-package

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup 'pnpm'
        if: matrix.package-manager == 'pnpm'
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Setup 'yarn'
        if: matrix.package-manager == 'yarn'
        run: |
          corepack enable

      - name: Setup 'bun'
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Setup Sandbox Folder
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/sandbox"
          cd "${{ runner.temp }}/sandbox"

      - name: Setup 'npm' Project
        shell: bash
        run: |
          npm init -y

      - name: Install Via 'npm'
        if: matrix.package-manager == 'npm'
        working-directory: ${{ runner.temp }}/sandbox
        shell: bash
        run: npm install "${{ github.workspace }}/staged-package"

      - name: Install Via 'pnpm'
        if: matrix.package-manager == 'pnpm'
        working-directory: ${{ runner.temp }}/sandbox
        shell: bash
        run: pnpm add "${{ github.workspace }}/staged-package"

      - name: Install Via 'yarn'
        if: matrix.package-manager == 'yarn'
        working-directory: ${{ runner.temp }}/sandbox
        shell: bash
        run: yarn add "${{ github.workspace }}/staged-package"

      - name: Install Via 'bun'
        if: matrix.package-manager == 'bun'
        working-directory: ${{ runner.temp }}/sandbox
        shell: bash
        run: bun add "${{ github.workspace }}/staged-package"

      - name: Verify Installation 'npm'
        if: matrix.package-manager == 'npm'
        working-directory: ${{ runner.temp }}/sandbox
        shell: bash
        run: npx vsuee --help

      - name: Verify Installation 'pnpm'
        if: matrix.package-manager == 'pnpm'
        working-directory: ${{ runner.temp }}/sandbox
        shell: bash
        run: pnpm exec vsuee --help

      - name: Verify Installation 'yarn'
        if: matrix.package-manager == 'yarn'
        working-directory: ${{ runner.temp }}/sandbox
        shell: bash
        run: yarn vsuee --help

      - name: Verify Installation 'bun'
        if: matrix.package-manager == 'bun'
        working-directory: ${{ runner.temp }}/sandbox
        shell: bash
        run: bunx --package vsuee-skill -- vsuee --help

  test-global-installation:
    needs: stage-release
    name: Test Global Install | Node ${{ matrix.node-version }} | ${{ matrix.os }} | ${{ matrix.package-manager }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18', '20', '22', '24', '26']
        package-manager: [npm, yarn, bun]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: staged-release
          path: staged-package

      - name: Enable Execution  # github actions may not recognize certain files as 'authorized' for execution
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x "${{ github.workspace }}/staged-package/bin/vsuee.mjs"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node-version }}          
    
      - name: Setup 'yarn'
        if: matrix.package-manager == 'yarn'
        run: |
          corepack enable

      - name: Setup 'bun'
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install Via 'npm'
        if: matrix.package-manager == 'npm'
        shell: bash
        run: npm install -g "${{ github.workspace }}/staged-package"

      - name: Export 'npm' Bin To Unix PATH
        if: matrix.package-manager == 'npm' && runner.os != 'Windows'
        shell: bash
        run: echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"

      - name: Export 'npm' Bin To Windows PATH
        if: matrix.package-manager == 'npm' && runner.os == 'Windows'
        shell: bash
        run: echo "$(npm config get prefix)" >> "$GITHUB_PATH"

      - name: Install Via 'yarn'
        if: matrix.package-manager == 'yarn'
        shell: bash
        run: yarn global add "file:${{ github.workspace }}/staged-package"

      - name: Export 'yarn' Bin To PATH
        if: matrix.package-manager == 'yarn'
        shell: bash
        run: echo "$(yarn global bin)" >> "$GITHUB_PATH"

      - name: Install Via 'bun'
        if: matrix.package-manager == 'bun'
        shell: bash
        run: bun add -g "${{ github.workspace }}/staged-package"

      - name: Export 'bun' Bin To PATH
        if: matrix.package-manager == 'bun'
        shell: bash
        run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify Installation Via ${{ matrix.package-manager }}
        if: runner.os != 'Windows'
        shell: bash
        run: vsuee --help

      - name: Verify Installation Via ${{ matrix.package-manager }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: vsuee --help
