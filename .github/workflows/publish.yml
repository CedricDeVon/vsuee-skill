name: NPM Publish

on:
  # Uncomment when merged to 'main' branch
  # push:
  #   tags:
  #     - "v*"

  # Demo purposes
  push:
    branches: [feat/**]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Output Filesystem Setup
        shell: bash
        run: |
          npm run output:cleanup
          npm run output:setup
      
      - name: Build Release Package
        shell: bash
        run: |
          npm run build:release:package
          npm run build:release:dist
          npm run rename:release:dist

      - name: Pre-Deployment Tests
        shell: bash
        run: |
          npm run test:release-package-content

      - name: Publish Staged Package To NPM
        shell: bash
        run: |
          npm run deploy:staged:npm:release
