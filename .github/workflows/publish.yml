name: Publish

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Setup Temporary Filesystem Tree
        run: |
          npm run tmp:cleanup
          npm run tmp:setup
      
      - name: Build Release Package
        run: |
          npm run build:release:package

      - name: Build Release Tarball
        run: |
          npm run build:release:dist
          npm run rename:release:dist

      - name: Testing Local Release Installation
        run: |
          npm run test:release:local-installation

      - name: Publish Staged Package To NPM
        run: |
          npm run deploy:staged:npm:release
